name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # Neither of these needs to be real. Prisma only reads the schema file
      # to generate the client (no live connection), and nothing in this app
      # queries the database during `next build` — the three statically
      # generated routes (/, /login, /register) carry no data fetching. A
      # syntactically valid dummy value is enough to satisfy the startup
      # checks in src/lib/db.ts and src/lib/auth/session.ts.
      DATABASE_URL: "postgres://ci:ci@localhost:5432/ci"
      SESSION_SECRET: "ci-only-value-never-used-to-protect-anything-real"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
